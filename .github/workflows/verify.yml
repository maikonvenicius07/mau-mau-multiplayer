name: Verificar Mau-Mau

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Usar Node 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Instalar dependências de forma reproduzível
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json encontrado: usando npm ci"
            npm ci --no-audit --no-fund
          else
            echo "package-lock.json ainda não existe: bootstrap inicial com npm install"
            npm install --no-audit --no-fund
          fi

      - name: Verificar projeto
        run: npm run verify

      # Diagnóstico independente: não interrompe a implantação em razão de
      # alertas preexistentes ou indisponibilidade temporária do registro npm.
      - name: Auditoria de dependências (não bloqueante)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > npm-audit-result.txt 2>&1
          audit_status=$?
          cat npm-audit-result.txt
          {
            echo "### Auditoria de dependências npm"
            if [ "$audit_status" -eq 0 ]; then
              echo "✅ A auditoria concluiu sem alertas altos/críticos."
            else
              echo "⚠️ A auditoria retornou código $audit_status. Verifique os logs para distinguir vulnerabilidades de falha de rede."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
